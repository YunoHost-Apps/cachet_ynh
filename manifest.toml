#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "cachet"
name = "Cachet"
description.en = "Status page to inform users about the state of online services"
description.fr = "Page de statut pour informer les utilisateur·ice·s de l'état de services en ligne"

version = "2026.10.05~ynh1"

maintainers = ["JimboJoe"]

[upstream]
license = "BSD-3-Clause"
website = "https://cachethq.io"
demo = "https://demo.cachethq.io"
admindoc = "https://docs.cachethq.io"
code = "https://github.com/CachetHQ/Cachet"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
	[install.domain]
	type = "domain"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

	[install.language]
	ask.en = "Choose the application language"
	ask.fr = "Choisissez la langue de l'application"
	type = "select"
	choices = ["fr", "en"]
	default = "en"

	[install.admin]
	type = "user"

	[install.password]
	type = "password"

[resources]
	[resources.sources.main]
	url = "https://github.com/CachetHQ/Cachet/archive/40bd0819ee46ee7094c336a1240a2a7a1291ccb8.tar.gz"
	sha256 = "c9e975195924c12c78bea13611d20f20958572b5f887b714868a9d80f607ea5a"
	autoupdate.strategy = "latest_github_commit"

	[resources.system_user]

	[resources.install_dir]
	group = "www-data:r-x"

	[resources.permissions]
	main.url = "/"

	[resources.apt]
	packages = [
		"mariadb-server",
		"php8.5-gd",
		"php8.5-mbstring",
		"php8.5-xml",
		"php8.5-mysql",
		"php8.5-sqlite3",
		"php8.5-intl",
		"php8.5-zip",
		"php8.5-curl"
	]

	[resources.database]
	type = "mysql"

	[resources.composer]
	version = "2.10.3"